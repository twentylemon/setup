---
- name: install git (linux)
  when: ansible_facts.os_family == "Debian"
  become: true
  ansible.builtin.package:
    name:
      - git
      - git-crypt
      - tig
    state: present
    update_cache: true

- name: install git (macos)
  when: ansible_facts.system == "Darwin"
  community.general.homebrew:
    name:
      - git
      - git-crypt
      - tig
    state: present

- name: create global gitignore
  ansible.builtin.file:
    path: "{{ global_gitignore }}"
    state: touch
    modification_time: preserve
    access_time: preserve

- name: create global git config
  ansible.builtin.git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: global
    state: present
  loop: "{{ config | dict2items }}"
  vars:
    config:
      core.excludesfile: "{{ global_gitignore }}"
      core.whitespace: trailing-space,space-before-tab
      diff.mnemonicprefix: "true"
      feature.manyfiles: "1"
      http.postbuffer: "524288000"
      merge.stat: "true"
      mergetool.keepbackup: "false"
      pack.windowmemory: 256m
      push.default: simple
      "url.git@github.com:.insteadof": "https://github.com/"
      alias.br: branch
      alias.co: checkout
      alias.st: status
      alias.up: "!git ft && git pull && git st || git st && git pull && git st"
      alias.undo: reset --hard
      alias.df: diff --stat
      alias.wip: commit -a -m "🚧 wip"
      alias.compress: repack -a -d -f --depth=250 --window=250 --threads=12 --window-memory=256m
      alias.size: "!du -h -d 0 $(git rev-parse --show-toplevel)/.git"
      alias.maintain: "!git size && git compress && git maintenance run --auto && git gc --aggressive --prune=now && git size"
      alias.ft: |-
        !f() { default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed "s|^origin/||"); if [ -z "$default" ]; then git remote set-head origin -a >/dev/null 2>&1; default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed "s|^origin/||"); fi; if [ -z "$default" ]; then echo "git ft: could not determine default branch for origin" >&2; return 1; fi; git config --local --unset-all remote.origin.fetch 2>/dev/null; git config --local --add remote.origin.fetch "+refs/heads/${default}:refs/remotes/origin/${default}"; git config --local --add remote.origin.fetch "+refs/heads/twentylemon/*:refs/remotes/origin/twentylemon/*"; git fetch --prune --prune-tags; }; f
      alias.cl: |-
        !f() { out=$(git clone "$@" 2>&1); rc=$?; echo "$out"; [ $rc -ne 0 ] && return $rc; dir=$(echo "$out" | sed -n "s/Cloning into '\(.*\)'.*/\1/p"); if [ -n "$dir" ] && [ -d "$dir" ]; then default=$(git -C "$dir" symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed "s|^origin/||"); if [ -z "$default" ]; then git -C "$dir" remote set-head origin -a >/dev/null 2>&1; default=$(git -C "$dir" symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed "s|^origin/||"); fi; if [ -z "$default" ]; then echo "git cl: could not determine default branch for origin" >&2; return 1; fi; git -C "$dir" config --local --unset-all remote.origin.fetch 2>/dev/null; git -C "$dir" config --local --add remote.origin.fetch "+refs/heads/${default}:refs/remotes/origin/${default}"; git -C "$dir" config --local --add remote.origin.fetch "+refs/heads/twentylemon/*:refs/remotes/origin/twentylemon/*"; echo "Configured narrow fetch: ${default} + twentylemon/*"; fi; }; f

- name: append community gitignore to global gitignore
  ansible.builtin.blockinfile:
    name: "{{ global_gitignore }}"
    marker: "# {mark} ANSIBLE {{ item.name }}"
    block: "{{ lookup('url', item.url, split_lines=False) }}"
    append_newline: true
    state: present
  loop: "{{ gitignore_sources }}"

- name: create git home directory
  ansible.builtin.file:
    path: "{{ repo_root }}"
    state: directory
    mode: "0755"

- name: install paramiko for ssh_config setup
  ansible.builtin.pip:
    name: paramiko
    state: present

- name: generate ssh key
  register: keypair
  community.crypto.openssh_keypair:
    path: "{{ default_sshkey }}"
    type: ed25519
    size: 4096
    state: present

- name: add key to ssh agent
  when: keypair.changed
  ansible.builtin.shell: |
    eval "$(ssh-agent -s)"
    ssh-add {{ default_sshkey }}

- name: work machine setup
  ansible.builtin.include_tasks:
    file: work.yml
    apply:
      tags:
        - work
  tags:
    - never
    - work
