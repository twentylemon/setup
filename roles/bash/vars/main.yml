---
rc_files:
  - "{{ home }}/.zshrc"
  - "{{ home }}/.bashrc"

shell_packages:
  Linux:
    - cowsay
    - fortune-mod
    - fortunes
    - bash-completion
    - htop
    - zip
    - unzip
    - nano
    - bc
    - jq
  Darwin:
    - jq
    - yq
    - htop
    - cowsay
    - fortune
    - bash-completion@2

snap_packages:
  - yq

update_cmd:
  Linux: "sudo apt-get update && sudo apt-get autoremove && sudo apt-get autoclean"
  Darwin: "brew update && brew upgrade && brew cleanup"

cows_dir:
  Linux: "/usr/share/cowsay/cows"
  Darwin: "/opt/homebrew/share/cowsay/cows"
